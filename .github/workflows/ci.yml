name: CI

# Pull requests, and pushes to main.
#
# `push` was unrestricted here once, which fired alongside `pull_request` for
# the same branch and ran this job twice per change; scoping it to main fixes
# that -- a pull request gets one run, and the merge gets a separate run on
# different content.
#
# The comment this replaces said a push to main was "already covered by the
# deploy workflow, which runs the same gates". That was false, and it is the
# gap this trigger closes: the deploy runs audit, lint, unit tests and the
# build, but no deploy in any of the three sibling repos runs a browser suite.
# Those live only here, so without a push trigger nothing browser-level ever
# ran against main.
#
# This workflow deploys nothing. If it goes red the site still publishes, which
# is the reason the browser suites belong here rather than in the deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch test model
        run: git lfs pull --include="public/models/katago-small.bin.gz" --exclude=""

      # Matches deploy-pages.yml. They used to differ -- 20 here, 24 there -- so
      # a pull request was verified on one major and the thing that actually
      # ships was built on another. A change that works on 20 and breaks on 24
      # passed review and failed the deploy.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      # typecheck -> test:typecheck -> lint -> test -> build, chained so the
      # first failure stops it. The same command developers run locally.
      #
      # CI is set by Actions, which skips the 71 tests that drive a real MCTS
      # search. Those need hundreds of visits through the net on the CPU
      # backend: seconds on a laptop, minutes here — enough that some exceeded
      # their 180s timeout and others asserted visit counts the search never
      # reached. Set ENGINE_TESTS=1 to run them anyway, and expect it to be slow.
      - name: Verify
        run: npm run verify

  viewport:
    name: Viewport (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: layout
            checks: layout,ShellVariantApplies,DialogsFitShortViewports,LongMetadataStaysRecoverable,PwaCardsClearTheBoard,AutoSaveRecoveryFits,HeaderNotificationsFit
          - group: library
            checks: LibraryImportFailures,LibraryTags,EmptyLibraryPersists,LibrarySaveRecovery,LibraryNavigation,LibraryActionKeys,DraftSaveSnapshots,DraftReplacement
          - group: analysis
            checks: ScoreQuizRequests,ScoreQuizGuesses,StaticBoardScroll,ManualScoring,PracticeBoardSizes,CandidateControls,PassCandidates,ReportPrinting,CandidateTooltips,LiveCandidatePreviews,PvGestures
          - group: editing
            checks: KeyboardWorkflows,NoteDraftRetention,NotePageExit,OgsSyncCancellation,GameInfoReplacement,GameInfoPageExit,DepthDismissal,SearchPasteLimits
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch test model
        run: git lfs pull --include="public/models/katago-small.bin.gz" --exclude=""

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare browser engine assets
        run: npm run copy:tfjs-wasm && npm run fetch:model

      # Each shard starts a cold Vite/Chrome session. Together they cover every
      # check; failures in one shard do not cancel the other reports.
      - name: Viewport and interaction checks
        id: viewport
        env:
          VIEWPORT_CHECKS: ${{ matrix.checks }}
        run: npm run test:viewport

      - name: Keep failed viewport screenshots
        if: failure() && steps.viewport.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: viewport-${{ matrix.group }}-screenshots
          path: /tmp/web-katrain-viewport-check
          if-no-files-found: ignore
          retention-days: 7
