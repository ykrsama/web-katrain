name: Deploy GitHub Pages and Fox Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check tests
        run: npm run test:typecheck

      - name: Build
        env:
          VITE_KATAGO_WS_URL: ${{ secrets.VITE_KATAGO_WS_URL }}
          VITE_FOX_API_BASE_URL: ${{ vars.VITE_FOX_API_BASE_URL }}
        run: npm run build

      - name: Validate Worker bundle
        run: npm run build:fox

      - name: Deploy and check Fox Worker
        if: ${{ vars.VITE_FOX_API_BASE_URL != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_FOX_API_BASE_URL: ${{ vars.VITE_FOX_API_BASE_URL }}
          FOX_ALLOWED_ORIGINS: ${{ vars.FOX_ALLOWED_ORIGINS }}
        run: npm run deploy:fox

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
